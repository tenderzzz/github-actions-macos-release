name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skill bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned on purpose; bump together with references/environment-facts.md.
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate skill files, links and shell syntax
        run: python3 scripts/validate.py

      - name: Simulate release publish branches with a fake gh
        run: python3 scripts/mock-release-branches.py

      - name: Ensure shellcheck
        run: |
          command -v shellcheck >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y shellcheck
          }
          shellcheck --version

      # Pin the actionable artifact and verify it against the release checksums,
      # instead of piping a moving installer script from the default branch.
      - name: Install actionlint (pinned, checksum-verified)
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "/tmp/${asset}" "${base}/${asset}"
          curl -fsSL -o /tmp/actionlint_checksums.txt "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          # sha256sum -c resolves the filename recorded in the checksum file, so keep the asset name.
          (cd /tmp && grep " ${asset}$" actionlint_checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/${asset}" -C /tmp actionlint
          /tmp/actionlint --version

      - name: Lint workflow template
        run: |
          set -euo pipefail
          /tmp/actionlint -shellcheck "$(command -v shellcheck)" assets/workflow-macos-package.yml

      - name: Lint repository workflows
        run: |
          set -euo pipefail
          /tmp/actionlint -shellcheck "$(command -v shellcheck)" .github/workflows/*.yml
